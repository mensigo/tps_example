# set API_PORT=18088
# set LOCUST_PORT=18089
# docker compose -f docker-compose.round-robin.yml up --build --scale predictor=2

services:
  predictor:
    build: ./app
    cpus: 1.0
    mem_limit: 2g
    # No host port: Nginx is the only public entry point for predictor.

  nginx:
    image: nginx:1.27-alpine
    cpus: 0.25
    mem_limit: 128m
    depends_on:
      - predictor
    ports:
      - "${API_PORT:-8088}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  locust:
    build:
      context: .
      dockerfile: loadtest/Dockerfile
    cpus: 1.0
    mem_limit: 512m
    depends_on:
      - nginx
    command:
      - -f
      - /work/loadtest/locustfile.py
      - --host=http://nginx:8080
      - --web-host=0.0.0.0
    ports:
      - "${LOCUST_PORT:-8089}:8089"
